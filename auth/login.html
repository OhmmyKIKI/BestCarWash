    <script>
        // Toast helper function
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;
            if (type === 'error') {
                toastContent.className = 'glass-panel bg-red-950/80 border-red-500/50 text-red-200 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm';
                toastIcon.className = 'material-symbols-outlined text-red-400 text-[22px]';
                toastIcon.textContent = 'error';
            } else {
                toastContent.className = 'glass-panel bg-emerald-950/80 border-secondary/50 text-emerald-200 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm';
                toastIcon.className = 'material-symbols-outlined text-secondary text-[22px]';
                toastIcon.textContent = 'check_circle';
            }

            toast.classList.remove('opacity-0', '-translate-y-10', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-10', 'pointer-events-none');
            }, 3500);
        }

        // Friendly error messages in Thai
        function formatAuthError(msg) {
            if (!msg) return 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
            const lower = msg.toLowerCase();
            if (lower.includes('invalid login credentials') || lower.includes('invalid credentials')) {
                return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
            }
            if (lower.includes('email not confirmed')) {
                return 'กรุณายืนยันอีเมลของคุณก่อนเข้าสู่ระบบ';
            }
            if (lower.includes('user not found')) {
                return 'ไม่พบบัญชีผู้ใช้นี้ในระบบ';
            }
            if (lower.includes('rate limit')) {
                return 'ลองเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่';
            }
            return msg;
        }

            if (window.supabaseClient) return window.supabaseClient;
            if (typeof getSupabaseClient === 'function') return getSupabaseClient();
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                const SUPABASE_URL = 'https://mrmtbzbfmgdfjsrdnzbv.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ybXRiemJmbWdkZmpzcmRuemJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE4NDcsImV4cCI6MjEwNDg3Nzg0N30.HXCGJ4byqFdEERHEOo_YaQA2DdF0-AsvRi1F54Uj0eI';
                window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return window.supabaseClient;
            }
            return null;
        }

        // Role verification and smart redirect
        const handleRedirect = async (user) => {
            if (!user) return;

            // Clear old cache from any previous user account to ensure complete data isolation
            const lastLoggedInUser = localStorage.getItem('lastLoggedInUserId');
            if (lastLoggedInUser !== user.id) {
                localStorage.removeItem('customerProfile');
                localStorage.removeItem('customerCars');
                localStorage.removeItem('ownerProfileAvatar');
                localStorage.removeItem('ownerShopName');
                localStorage.removeItem('ownerProfileName');
                localStorage.removeItem('appBookingsList');
                localStorage.removeItem('activeCustomerBooking');
                localStorage.removeItem('favoriteShopIds');
                localStorage.setItem('lastLoggedInUserId', user.id);
            }

            let role = user.user_metadata?.role;
            const client = getClient();
            let profile = null;

            // Fetch live profile details from public.profiles
            if (user.id && client) {
                try {
                    const { data } = await client
                        .from('profiles')
                        .select('*')
                        .eq('id', user.id)
                        .maybeSingle();
                    if (data) {
                        profile = data;
                        if (data.role) role = data.role;
                    }
                } catch (err) {
                    console.error('Error fetching profile on login:', err);
                }
            }

            if (role === 'OWNER') {
                const avatar = profile?.avatar_url || user.user_metadata?.avatar_url || null;
                const name = profile?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'เจ้าของร้าน';
                if (avatar) localStorage.setItem('ownerProfileAvatar', avatar);
                if (name) localStorage.setItem('ownerProfileName', name);

                // Also fetch owner shop name, description, address & ensure services are synced
                if (client) {
                    try {
                        const meta = user.user_metadata || {};
                        const fallbackDesc = meta.shop_description || meta.description || meta.about || localStorage.getItem('ownerShopDesc') || localStorage.getItem('shopDescription') || '';
                        const fallbackAddr = meta.full_address || meta.address || [meta.street, meta.city, meta.zip].filter(Boolean).join(' ') || [localStorage.getItem('ownerShopStreet'), localStorage.getItem('ownerShopCity'), localStorage.getItem('ownerShopZip')].filter(Boolean).join(' ') || '';
                        const fallbackPhone = meta.phone_number || localStorage.getItem('ownerShopPhone') || '';
                        const fallbackLat = meta.latitude || parseFloat(localStorage.getItem('ownerShopLat')) || null;
                        const fallbackLng = meta.longitude || parseFloat(localStorage.getItem('ownerShopLng')) || null;

                        let { data: shop } = await client.from('shops').select('*').eq('owner_id', user.id).maybeSingle();
                        if (!shop) {
                            const sName = meta.shop_name || `${name}'s Car Wash`;
                            const { data: newShop } = await client.from('shops').insert({
                                owner_id: user.id,
                                name: sName,
                                phone_number: fallbackPhone,
                                description: fallbackDesc,
                                address: fallbackAddr,
                                latitude: fallbackLat,
                                longitude: fallbackLng
                            }).select('*').maybeSingle();

                            if (newShop) shop = newShop;
                        } else {
                            // Self-healing: if shops table has missing description or address, sync from user_metadata or localStorage
                            const updateData = {};
                            if (!shop.description && fallbackDesc) updateData.description = fallbackDesc;
                            if (!shop.address && fallbackAddr) updateData.address = fallbackAddr;
                            if (!shop.phone_number && fallbackPhone) updateData.phone_number = fallbackPhone;
                            if (!shop.latitude && fallbackLat) updateData.latitude = fallbackLat;
                            if (!shop.longitude && fallbackLng) updateData.longitude = fallbackLng;

                            if (Object.keys(updateData).length > 0) {
                                await client.from('shops').update(updateData).eq('id', shop.id);
                                Object.assign(shop, updateData);
                            }
                        }

                        if (shop) {
                            localStorage.setItem('currentShopId', shop.id);
                            if (shop.name || meta.shop_name) localStorage.setItem('ownerShopName', shop.name || meta.shop_name);
                            const finalDesc = shop.description || fallbackDesc;
                            if (finalDesc) {
                                localStorage.setItem('ownerShopDesc', finalDesc);
                                localStorage.setItem('shopDescription', finalDesc);
                            }
                            if (shop.phone_number || fallbackPhone) {
                                localStorage.setItem('ownerShopPhone', shop.phone_number || fallbackPhone);
                            }
                            
                            const streetVal = shop.address || fallbackAddr;
                            const cityVal = meta.city || localStorage.getItem('ownerShopCity') || '';
                            const zipVal = meta.zip || localStorage.getItem('ownerShopZip') || '';
                            const mapLinkVal = meta.map_link || localStorage.getItem('ownerShopMapLink') || (shop.latitude && shop.longitude ? `https://maps.google.com/?q=${shop.latitude},${shop.longitude}` : '');

                            if (streetVal) localStorage.setItem('ownerShopStreet', streetVal);
                            if (cityVal) localStorage.setItem('ownerShopCity', cityVal);
                            if (zipVal) localStorage.setItem('ownerShopZip', zipVal);
                            if (mapLinkVal) localStorage.setItem('ownerShopMapLink', mapLinkVal);
                            if (shop.latitude) localStorage.setItem('ownerShopLat', shop.latitude);
                            if (shop.longitude) localStorage.setItem('ownerShopLng', shop.longitude);
                            
                            // Cover Image cache sync from database or metadata
                            const cover = shop.cover_image_url || meta.cover_image_url || localStorage.getItem('ownerCoverImage');
                            if (cover) {
                                localStorage.setItem('ownerCoverImage', cover);
                                localStorage.setItem('ownerShopGallery', JSON.stringify([cover]));
                            }

                            // Logo / Avatar sync from database
                            const logo = shop.logo_url || avatar;
                            if (logo) localStorage.setItem('ownerProfileAvatar', logo);

                            // Multi-Photo Gallery sync
                            if (meta.shop_images && Array.isArray(meta.shop_images) && meta.shop_images.length > 0) {
                                localStorage.setItem('ownerShopGallery', JSON.stringify(meta.shop_images));
                            }

                            // 1. Services Self-Healing & Hydration
                            let { data: srvs } = await client.from('services').select('*').eq('shop_id', shop.id).order('created_at', { ascending: true });
                            let savedServices = user.user_metadata?.initial_services;
                            if (!savedServices || !savedServices.length) {
                                try {
                                    savedServices = JSON.parse(localStorage.getItem('ownerServices') || 'null');
                                } catch(_) {}
                            }

                            if (!srvs || srvs.length === 0) {
                                let toSeed = (savedServices && savedServices.length > 0) ? savedServices : [
                                    { name: 'ล้างสีภายนอก', price: 150, duration_minutes: 30, description: 'ล้างทำความสะอาดภายนอก ฉีดโฟม เคลือบเงายาง' },
                                    { name: 'ทำความสะอาดพรีเมียม (ภายใน+ภายนอก)', price: 400, duration_minutes: 60, description: 'ล้างสีรอบคัน + ดูดฝุ่น เช็ดคอนโซล แผงประตู สะอาดลึก' },
                                    { name: 'ดูดฝุ่น & สปาภายในห้องโดยสาร', price: 250, duration_minutes: 45, description: 'ดูดฝุ่น ฟอกเบาะผ้า เช็ดคอนโซล ฆ่าเชื้อแบคทีเรีย' },
                                    { name: 'เคลือบแว็กซ์สีรถ & กระจก', price: 350, duration_minutes: 45, description: 'ลงน้ำยาเคลือบสีพรีเมียม เพิ่มความเงา ป้องกันคราบน้ำ' }
                                ];
                                const { data: seeded } = await client.from('services').insert(toSeed.map(s => ({
                                    shop_id: shop.id,
                                    name: s.name,
                                    price: parseFloat(s.price) || 150,
                                    duration_minutes: parseInt(s.duration_minutes) || 30,
                                    description: s.description || 'บริการมาตรฐาน'
                                }))).select();
                                srvs = seeded || toSeed;
                            }
                            if (srvs && srvs.length > 0) {
                                localStorage.setItem('ownerServices', JSON.stringify(srvs));
                            }

                            // 2. Operating Hours Self-Healing & Hydration
                            let { data: hours } = await client.from('shop_operating_hours').select('*').eq('shop_id', shop.id);
                            if (!hours || hours.length === 0) {
                                let hoursToSeed = null;
                                try {
                                    const local = JSON.parse(localStorage.getItem('ownerOperatingHours') || 'null');
                                    if (Array.isArray(local) && local.length > 0) {
                                        hoursToSeed = local.map(h => ({
                                            shop_id: shop.id,
                                            day_of_week: h.day_of_week,
                                            open_time: h.open_time || '08:00:00',
                                            close_time: h.close_time || '18:00:00',
                                            is_closed: !!h.is_closed
                                        }));
                                    }
                                } catch(_) {}

                                const defaultHours = hoursToSeed || [
                                    { shop_id: shop.id, day_of_week: 1, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 2, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 3, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 4, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 5, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 6, open_time: '08:00:00', close_time: '18:00:00', is_closed: false },
                                    { shop_id: shop.id, day_of_week: 0, open_time: '08:00:00', close_time: '18:00:00', is_closed: true }
                                ];
                                const { data: seededHours } = await client.from('shop_operating_hours').upsert(defaultHours, { onConflict: 'shop_id,day_of_week' }).select();
                                hours = seededHours || defaultHours;
                            }
                            if (hours && hours.length > 0) {
                                localStorage.setItem('ownerOperatingHours', JSON.stringify(hours));
                            }
                            const cloudHolidays = meta.special_holidays || user.user_metadata?.special_holidays;
                            if (Array.isArray(cloudHolidays) && cloudHolidays.length > 0) {
                                localStorage.setItem('ownerSpecialHolidays', JSON.stringify(cloudHolidays));
                            }

                            // 3. Pre-fetch and cache Dashboard KPI for 0ms initial dashboard display
                            try {
                                const { data: bList } = await client.from('bookings').select('status').eq('shop_id', shop.id);
                                if (bList) {
                                    const delivered = bList.filter(b => String(b.status).toLowerCase() === 'completed').length;
                                    const inService = bList.filter(b => ['washing', 'arrived', 'ready'].includes(String(b.status).toLowerCase())).length;
                                    const cancelled = bList.filter(b => ['refunded', 'declined', 'no_show', 'refund_requested', 'cancelled'].includes(String(b.status).toLowerCase())).length;
                                    const total = bList.length;
                                    localStorage.setItem('ownerDashboardKPI', JSON.stringify({ delivered, total, inService, cancelled }));
                                }
                            } catch(_) {}
                        }
                    } catch(e) {
                        console.warn('Owner shop login sync notice:', e);
                    }
                }
                window.location.href = '../owner/Owner%20Dashboard.html';
            } else if (role === 'CUSTOMER') {
                const customerData = {
                    fullName: profile?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'ลูกค้า',
                    phone: profile?.phone_number || user.user_metadata?.phone_number || '',
                    email: user.email,
                    avatar: profile?.avatar_url || user.user_metadata?.avatar_url || null
                };
                localStorage.setItem('customerProfile', JSON.stringify(customerData));
                window.location.href = '../customer/discovery.html';
            } else {
                // New user without role assigned
                window.location.href = 'role-selection.html';
            }
        };

        // Check existing session on page load
        const initClient = getClient();
        if (initClient?.auth) {
            initClient.auth.getSession().then(({ data: { session } }) => {
                if (session?.user) {
                    handleRedirect(session.user);
                }
            });

            // Listen for OAuth callbacks
            initClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session?.user) {
                    handleRedirect(session.user);
                }
            });
        }

        // Email Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const originalHTML = btn.innerHTML;

            const client = getClient();
            if (!client || !client.auth) {
                showToast('ไม่สามารถเชื่อมต่อระบบฐานข้อมูลได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> กำลังเข้าสู่ระบบ...';
            
            try {
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password,
                });
                
                if (error) {
                    showToast(formatAuthError(error.message), 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                } else if (data?.user) {
                    showToast('เข้าสู่ระบบสำเร็จ กำลังนำทาง...', 'success');
                    setTimeout(() => {
                        handleRedirect(data.user);
                    }, 500);
                }
            } catch (err) {
                console.error('Login error:', err);
                showToast(formatAuthError(err.message || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ'), 'error');
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        });



        // Toggle Password Visibility
        const pwInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        if (pwInput && toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const icon = toggleBtn.querySelector('span');
                if (pwInput.type === 'password') {
                    pwInput.type = 'text';
                    icon.innerText = 'visibility';
                } else {
                    pwInput.type = 'password';
                    icon.innerText = 'visibility_off';
                }
            });
        }
    </script>
</body>
</html>
