    <style>

<body class="bg-background text-on-surface min-h-[100dvh] flex flex-col items-center justify-center py-6 px-4 sm:py-10 sm:px-6 relative overflow-x-hidden font-sans selection:bg-primary-container selection:text-on-primary-container">
    
    <!-- Background Elements -->
    <div class="fixed inset-0 w-full h-full pointer-events-none opacity-30 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container blur-[100px] mix-blend-screen"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container blur-[100px] mix-blend-screen"></div>
    </div>

    <!-- Top Navigation (Back Button) -->
    <div class="w-full max-w-xl md:max-w-2xl lg:max-w-3xl xl:max-w-4xl mb-3 sm:mb-0 sm:absolute sm:top-8 sm:left-8 z-20">
        <a href="login.html" class="inline-flex items-center gap-2 text-sm md:text-base lg:text-lg text-on-surface hover:text-primary transition-colors py-2 px-3.5 rounded-lg hover:bg-surface-container/60">
            <span class="material-symbols-outlined text-[20px] sm:text-[24px]">arrow_back</span>
            <span class="font-medium">กลับไปหน้าเข้าสู่ระบบ</span>
        </a>
    </div>

    <!-- Main Content Canvas (Extra Large Card Web & App Container) -->
    <main class="w-full max-w-lg sm:max-w-xl md:max-w-2xl lg:max-w-3xl xl:max-w-4xl z-10 glass-panel rounded-2xl sm:rounded-3xl p-7 sm:p-11 md:p-14 flex flex-col gap-7 sm:gap-9 shadow-2xl relative glow-effect border border-outline-variant/30 my-auto">
        
        <!-- Header -->
        <header class="flex flex-col items-center gap-2 text-center">
            <div class="w-14 h-14 sm:w-18 sm:h-18 md:w-22 md:h-22 rounded-2xl bg-primary-container/20 border border-primary-container/30 flex items-center justify-center text-primary mb-1 shadow-md">
                <span class="material-symbols-outlined text-[32px] sm:text-[42px] md:text-[50px]">local_car_wash</span>
            </div>
            <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-primary tracking-tight">เข้าร่วม BestCarWash</h1>
            <p class="text-sm sm:text-base md:text-lg text-on-surface/80 max-w-lg">เลือกประเภทบัญชีของคุณเพื่อเริ่มต้นการใช้งาน</p>
        </header>

        <!-- Role Selection -->
        <div class="flex flex-col gap-4 sm:gap-6">
            
            <!-- Customer Card -->
            <div class="role-card glass-panel rounded-xl sm:rounded-2xl md:rounded-3xl p-5 sm:p-7 md:p-8 flex items-center gap-5 sm:gap-6 md:gap-7 border border-outline-variant/50 hover:border-primary/50 transition-all" data-role="customer" onclick="selectRole('customer')">
                <div class="w-14 h-14 sm:w-18 sm:h-18 md:w-22 md:h-22 rounded-2xl bg-primary-container/20 flex items-center justify-center border border-primary-container/30 flex-shrink-0 shadow-inner">
                    <span class="material-symbols-outlined text-primary text-3xl sm:text-4xl md:text-5xl" style="font-variation-settings: 'FILL' 1;">person</span>
                </div>
                <div class="flex flex-col text-left flex-grow">
                    <h3 class="text-lg sm:text-2xl md:text-3xl font-bold text-primary">ลูกค้าทั่วไป</h3>
                    <p class="text-xs sm:text-base md:text-lg text-on-surface/80 mt-1 leading-relaxed">ค้นหา เปรียบเทียบ และจองคิวบริการล้างรถใกล้คุณ</p>
                </div>
                <div class="selection-indicator opacity-0 transition-opacity flex-shrink-0">
                    <span class="material-symbols-outlined text-primary text-[26px] sm:text-[32px] md:text-[38px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                </div>
            </div>

            <!-- Shop Owner Card -->
            <div class="role-card glass-panel rounded-xl sm:rounded-2xl md:rounded-3xl p-5 sm:p-7 md:p-8 flex items-center gap-5 sm:gap-6 md:gap-7 border border-outline-variant/50 hover:border-primary/50 transition-all" data-role="owner" onclick="selectRole('owner')">
                <div class="w-14 h-14 sm:w-18 sm:h-18 md:w-22 md:h-22 rounded-2xl bg-primary-container/20 flex items-center justify-center border border-primary-container/30 flex-shrink-0 shadow-inner">
                    <span class="material-symbols-outlined text-primary text-3xl sm:text-4xl md:text-5xl" style="font-variation-settings: 'FILL' 1;">storefront</span>
                </div>
                <div class="flex flex-col text-left flex-grow">
                    <h3 class="text-lg sm:text-2xl md:text-3xl font-bold text-primary">เจ้าของร้านคาร์แคร์</h3>
                    <p class="text-xs sm:text-base md:text-lg text-on-surface/80 mt-1 leading-relaxed">ลงทะเบียนร้านค้า จัดการคิวบริการ และขยายธุรกิจของคุณ</p>
                </div>
                <div class="selection-indicator opacity-0 transition-opacity flex-shrink-0">
                    <span class="material-symbols-outlined text-primary text-[26px] sm:text-[32px] md:text-[38px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                </div>
            </div>

        </div>

        <!-- Action Button -->
        <button id="continueBtn" class="w-full h-14 sm:h-16 md:h-18 bg-surface-container-highest/60 text-on-surface font-bold rounded-xl sm:rounded-2xl flex items-center justify-center gap-3 transition-all duration-200 mt-2 opacity-50 cursor-not-allowed text-base sm:text-xl md:text-2xl" disabled onclick="handleContinue()">
            <span>ดำเนินการต่อ</span>
            <span class="material-symbols-outlined text-[22px] sm:text-[28px]">arrow_forward</span>
        </button>

    </main>

    <script>
        let selectedRole = null;

        function selectRole(role) {
            selectedRole = role;
            try {
                localStorage.setItem('preferredRole', role);
            } catch(_) {}
            
            // Reset all cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('selected');
                card.querySelector('.selection-indicator')?.classList.remove('opacity-100');
                card.querySelector('.selection-indicator')?.classList.add('opacity-0');
            });

            // Highlight selected card
            const activeCard = document.querySelector(`.role-card[data-role="${role}"]`);
            if (activeCard) {
                activeCard.classList.add('selected');
                activeCard.querySelector('.selection-indicator')?.classList.remove('opacity-0');
                activeCard.querySelector('.selection-indicator')?.classList.add('opacity-100');
            }

            // Enable Continue button
            const continueBtn = document.getElementById('continueBtn');
            if (continueBtn) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-container-high', 'bg-surface-container-highest/60', 'opacity-50', 'cursor-not-allowed');
                continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'metallic-highlight', 'hover:opacity-90', 'active:scale-95', 'glow-effect');
            }
        }

        function handleContinue() {
            if (!selectedRole) return;
            
            if (selectedRole === 'customer') {
                window.location.href = 'signup.html';
            } else if (selectedRole === 'owner') {
                window.location.href = 'owner-signup.html';
            }
        }

        // ==========================================
        // LAYER 1: INSTANT 0.00ms PRE-SELECTION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paramRole = urlParams.get('role');
            const savedRole = paramRole || localStorage.getItem('preferredRole');
            if (savedRole && (savedRole === 'customer' || savedRole === 'owner')) {
                selectRole(savedRole);
            }

            // ========================================================
            // LAYER 2: SILENT FAST-TRACK BACKGROUND SESSION CHECK
            // ========================================================
            (async () => {
                try {
                    const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
                    if (client?.auth) {
                        const { data: { session } } = await client.auth.getSession();
                        if (session?.user) {
                            const user = session.user;
                            const role = user.user_metadata?.role;
                            if (role === 'OWNER' || user.user_metadata?.shop_name) {
                                window.location.href = '../owner/Owner%20Dashboard.html';
                            } else if (role === 'CUSTOMER') {
                                window.location.href = '../customer/discovery.html';
                            }
                        }
                    }
                } catch(_) {}
            })();
        });
    </script>
</body>
</html>
