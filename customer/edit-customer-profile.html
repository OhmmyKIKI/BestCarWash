<script>
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='cgrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231e3a8a'/><stop offset='100%' stop-color='%233b82f6'/></linearGradient></defs><circle cx='50' cy='50' r='50' fill='url(%23cgrad)'/><circle cx='50' cy='37' r='16' fill='%23ffffff'/><path d='M50 60c-18 0 -30 11 -30 25v5h60v-5c0-14-12-25-30-25z' fill='%23ffffff'/></svg>";

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('editProfileForm');
        const toast = document.getElementById('toast');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const fileInput = document.getElementById('profileImageInput');
        const previewImg = document.getElementById('profileImagePreview');
        const headerAvatar = document.getElementById('edit-header-avatar');
        const resetBtn = document.getElementById('resetAvatarBtn');
        let currentAvatar = DEFAULT_AVATAR;

        function updateResetButtonVisibility() {
            if (resetBtn) {
                if (currentAvatar && currentAvatar !== DEFAULT_AVATAR) {
                    resetBtn.classList.remove('hidden');
                } else {
                    resetBtn.classList.add('hidden');
                }
            }
        }

        window.resetToDefaultAvatar = function() {
            currentAvatar = DEFAULT_AVATAR;
            previewImg.src = DEFAULT_AVATAR;
            if (headerAvatar) headerAvatar.src = DEFAULT_AVATAR;
            fileInput.value = '';
            updateResetButtonVisibility();
        };

        // Load existing saved profile if any
        const savedProfile = localStorage.getItem('customerProfile');
        if (savedProfile) {
            try {
                const data = JSON.parse(savedProfile);
                if (data.fullName) {
                    fullNameInput.value = data.fullName;
                    const desktopName = document.getElementById('desktop-header-name');
                    if (desktopName) desktopName.innerText = data.fullName;
                }
                if (data.email) emailInput.value = data.email;
                if (data.phone) phoneInput.value = data.phone;
                if (data.avatar && !data.avatar.includes('googleusercontent')) {
                    currentAvatar = data.avatar;
                    previewImg.src = data.avatar;
                    if (headerAvatar) headerAvatar.src = data.avatar;
                } else {
                    currentAvatar = DEFAULT_AVATAR;
                    previewImg.src = DEFAULT_AVATAR;
                    if (headerAvatar) headerAvatar.src = DEFAULT_AVATAR;
                }
            } catch (e) {
                console.error(e);
            }
        } else {
            previewImg.src = DEFAULT_AVATAR;
            if (headerAvatar) headerAvatar.src = DEFAULT_AVATAR;
        }

        updateResetButtonVisibility();

        // Load live profile from Supabase if available via safeSupabaseRest
        (async () => {
            try {
                const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
                let user = null;
                if (client?.auth) {
                    const sessRes = await client.auth.getSession().catch(() => null);
                    user = sessRes?.data?.session?.user;
                }
                const uid = user?.id || localStorage.getItem('lastLoggedInUserId');
                const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;

                if (user?.email && !emailInput.value) emailInput.value = user.email;

                if (uid && fetcher) {
                    const profiles = await fetcher(`profiles?id=eq.${uid}&limit=1`);
                    const profile = Array.isArray(profiles) && profiles.length > 0 ? profiles[0] : null;
                    if (profile) {
                        if (profile.full_name) {
                            fullNameInput.value = profile.full_name;
                            const desktopName = document.getElementById('desktop-header-name');
                            if (desktopName) desktopName.innerText = profile.full_name;
                        }
                        if (profile.phone_number) phoneInput.value = profile.phone_number;
                        if (profile.avatar_url && profile.avatar_url !== DEFAULT_AVATAR) {
                            currentAvatar = profile.avatar_url;
                            previewImg.src = profile.avatar_url;
                            if (headerAvatar) headerAvatar.src = profile.avatar_url;
                            updateResetButtonVisibility();
                        }
                    }
                }
            } catch(e) {
                console.warn('Edit profile initial fetch notice:', e);
            }
        })();

        // Handle Image Selection and Auto-Compression
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    currentAvatar = compressedBase64;
                    previewImg.src = compressedBase64;
                    if (headerAvatar) headerAvatar.src = compressedBase64;
                    updateResetButtonVisibility();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const profileData = {
                fullName: fullNameInput.value.trim(),
                email: emailInput.value.trim(),
                phone: phoneInput.value.trim(),
                avatar: currentAvatar || DEFAULT_AVATAR
            };
            localStorage.setItem('customerProfile', JSON.stringify(profileData));

            // Instant feedback (0ms)
            toast.classList.add('show');

            // Non-blocking background sync to Supabase
            (async () => {
                try {
                    const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
                    let user = null;
                    if (client?.auth) {
                        const sessRes = await client.auth.getSession().catch(() => null);
                        user = sessRes?.data?.session?.user;
                    }
                    const uid = user?.id || localStorage.getItem('lastLoggedInUserId');
                    const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;

                    if (uid && fetcher) {
                        await fetcher(`profiles?id=eq.${uid}`, {
                            method: 'PATCH',
                            body: {
                                full_name: profileData.fullName,
                                phone_number: profileData.phone,
                                avatar_url: profileData.avatar
                            }
                        });
                    }

                    if (client?.auth && user) {
                        const metaUpdate = {
                            full_name: profileData.fullName,
                            phone_number: profileData.phone
                        };
                        if (profileData.avatar && !profileData.avatar.startsWith('data:') && profileData.avatar.length < 1000) {
                            metaUpdate.avatar_url = profileData.avatar;
                        } else {
                            metaUpdate.avatar_url = null;
                        }
                        await client.auth.updateUser({
                            data: metaUpdate
                        }).catch(() => {});
                    }
                } catch (err) {
                    console.warn('Profile Supabase update notice:', err);
                }
            })();
            
            setTimeout(() => {
                toast.classList.remove('show');
                window.location.href = 'Customer%20Profile.html';
            }, 500);
        });
    });
</script>
