                  "surface-container": "#ffffff",    // Card Pure White

                  "surface-container-highest": "#f1f5f9", // Slate 100

                  "surface-variant": "#f1f5f9",

                  "outline": "#94a3b8",              // Slate 400
                  "outline-variant": "#e2e8f0",      // Slate 200 border
                  "primary-container": "#0284c7",    // Ocean Blue
                  "on-primary-container": "#ffffff", // Pure White
                  "secondary-container": "#ecfdf5",  // Mint 50
                  "on-secondary-container": "#065f46", // Mint 900

                      "stack-md": "1rem",
                      "stack-lg": "1.5rem"
              },
              "fontFamily": {
                      "sans": ["Prompt", "Inter", "sans-serif"]
              }
            }
          }
        }
      </script>
      <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Notification entrance animation */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .notif-item {
            animation: slideIn 0.3s ease-out forwards;
        }
      </style>
</head>
<body class="bg-background text-on-background min-h-screen font-sans flex flex-col relative overflow-x-hidden pb-28 md:pb-12 pt-0 md:pt-20">
    
<!-- Desktop Header (App Bar) -->
<header class="hidden md:flex justify-between items-center px-6 lg:px-10 h-20 bg-surface-container-low/95 backdrop-blur-md border-b border-outline-variant/30 shadow-md z-50 fixed top-0 w-full">
    <!-- Brand Logo -->
    <div class="flex items-center gap-6">

                <span class="material-symbols-outlined text-primary text-[28px] group-hover:rotate-12 transition-transform duration-300">local_car_wash</span>
            </div>

    <!-- Navigation & User Profile -->
    <div class="flex items-center gap-6">
        <nav class="flex items-center gap-5 lg:gap-7">

                <span class="material-symbols-outlined text-[20px]">explore</span> ค้นหาร้าน
            </a>
            <a class="text-base font-semibold text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1.5 py-1" href="booking-history-Customer.html">
                <span class="material-symbols-outlined text-[20px]">receipt_long</span> การจองของฉัน
            </a>
            <a class="text-base font-semibold text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1.5 py-1" href="favorite-shops.html">
                <span class="material-symbols-outlined text-[20px]">favorite</span> ร้านโปรด
            </a>
        </nav>

        <div class="flex items-center gap-4 border-l border-outline-variant/30 pl-5 lg:pl-6">
            <a href="customer-notifications-list.html" class="w-11 h-11 rounded-full flex items-center justify-center bg-primary/20 text-primary transition-colors relative border border-primary/40 shadow-sm" title="การแจ้งเตือน">
                <span class="material-symbols-outlined text-[24px]">notifications</span>
                <span id="desktop-unread-badge" class="absolute top-2.5 right-3 w-2.5 h-2.5 bg-error rounded-full shadow-[0_0_5px_rgba(255,180,171,0.8)]"></span>

            <!-- User Profile Chip -->
            <a href="Customer%20Profile.html" class="flex items-center gap-3 pl-1.5 pr-4 py-1.5 rounded-full bg-surface-container hover:bg-surface-variant border border-outline-variant/40 hover:border-primary transition-all shadow-md group" title="โปรไฟล์ของฉัน">
                <div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest border border-outline-variant/40 flex-shrink-0">
                    <img id="desktop-header-avatar" alt="User profile" class="w-full h-full object-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23cbd5e1'/><circle cx='50' cy='38' r='18' fill='%23ffffff'/><path d='M50 62c-20 0 -34 12 -34 28v10h68v-10c0-16-14-28-34-28z' fill='%23ffffff'/></svg>"/>
                </div>
                <span class="hidden md:inline-block text-base font-semibold text-on-surface group-hover:text-primary transition-colors" id="desktop-header-name">โปรไฟล์</span>

<!-- Mobile Header -->
<header class="md:hidden sticky top-0 w-full z-50 bg-surface-container-low/95 backdrop-blur-md border-b border-outline-variant/30 shadow-sm px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
        <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface hover:text-primary active:scale-95 border border-outline-variant/30">
            <span class="material-symbols-outlined text-[22px]">arrow_back</span>
        </button>

            <h1 class="text-xl font-bold text-on-surface tracking-tight leading-tight">การแจ้งเตือน</h1>

    </div>
    <div>
        <button onclick="markAllAsRead()" class="text-primary text-sm font-bold hover:text-primary/80 transition-colors active:scale-95 px-3 py-1.5 rounded-lg bg-primary/10 border border-primary/20">อ่านทั้งหมด</button>

<main class="pt-4 md:pt-8 px-4 md:px-6 max-w-3xl mx-auto flex flex-col gap-4 pb-12 w-full">
    
    <!-- Category Filter Pills -->
    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-2 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0 sticky top-16 bg-background/95 backdrop-blur-sm z-40 border-b border-outline-variant/10">
        <button onclick="filterNotifs('all')" id="btn-all" class="flex-shrink-0 px-4 py-1.5 bg-primary-container text-on-primary-container rounded-full text-xs font-bold border border-primary/50 shadow-sm transition-colors">ทั้งหมด</button>
        <button onclick="filterNotifs('booking')" id="btn-booking" class="flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-primary rounded-full text-xs font-medium border border-outline-variant hover:border-primary transition-colors">การจอง</button>
        <button onclick="filterNotifs('system')" id="btn-system" class="flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-primary rounded-full text-xs font-medium border border-outline-variant hover:border-primary transition-colors">ระบบ</button>
    </div>

    <div id="notifications-container" class="flex flex-col gap-3 mt-2">
        <!-- Dynamically loaded from Supabase notifications table -->
    </div>

    <!-- Empty State (Hidden by default) -->
    <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center opacity-0 transition-opacity duration-300">
        <div class="w-24 h-24 bg-surface-container rounded-full flex items-center justify-center mb-4 border border-outline-variant/30 shadow-inner">
            <span class="material-symbols-outlined text-[48px] text-outline-variant">notifications_off</span>
        </div>
        <h3 class="text-lg font-bold text-on-surface mb-2">ไม่มีการแจ้งเตือน</h3>
        <p class="text-sm text-on-surface-variant">คุณยังไม่มีการแจ้งเตือนในหมวดหมู่นี้</p>
    </div>

</main>

<script>
    let userNotifications = [];

    function formatTimeAgo(dateString) {
        if (!dateString) return 'เมื่อสักครู่';
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return 'เมื่อสักครู่';
        const diffMs = Date.now() - d.getTime();
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return 'เพิ่งส่งมา';
        if (diffMins < 60) return `${diffMins} นาทีที่แล้ว`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} ชม. ที่แล้ว`;
        const diffDays = Math.floor(diffHours / 24);
        if (diffDays < 7) return `${diffDays} วันที่แล้ว`;
        return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
    }

    function updateUnreadBadgeUI(list) {
        const unreadCount = (list || []).filter(item => !item.is_read).length;
        const desktopBadge = document.getElementById('desktop-unread-badge');
        if (desktopBadge) {
            desktopBadge.style.display = unreadCount > 0 ? 'block' : 'none';
        }
        const mobileBadge = document.getElementById('unread-count-text');
        if (mobileBadge) {
            mobileBadge.innerText = unreadCount > 0 ? `(${unreadCount} รายการใหม่)` : '';
        }
    }

    function showEmptyState(show) {
        const emptyState = document.getElementById('empty-state');
        const container = document.getElementById('notifications-container');
        if (show) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
            setTimeout(() => emptyState.classList.remove('opacity-0'), 10);
        } else {
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            emptyState.classList.add('opacity-0');
        }
    }

    function renderNotificationsList(list) {
        const container = document.getElementById('notifications-container');
        if (!list || list.length === 0) {
            showEmptyState(true);
            updateUnreadBadgeUI([]);
            return;
        }

        showEmptyState(false);
        updateUnreadBadgeUI(list);

        container.innerHTML = list.map(item => {
            const isUnread = !item.is_read;
            const category = (item.type && item.type.toLowerCase().includes('booking')) ? 'booking' : 'system';
            const iconName = category === 'booking' ? 'event_available' : 'notifications';
            const iconColor = category === 'booking' ? 'text-primary bg-primary/10 border-primary/25' : 'text-secondary bg-secondary/10 border-secondary/25';
            const safeId = String(item.id || '');

            return `
                <a href="booking-history-Customer.html" onclick="markSingleAsRead('${safeId}', event, 'booking-history-Customer.html')" class="notif-item ${isUnread ? 'bg-white shadow-[0_4px_20px_rgba(15,23,42,0.06)] border-primary/30 ring-1 ring-primary/20' : 'bg-surface-container/70 opacity-90 border-outline-variant/30'} hover:bg-surface-container-highest transition-all rounded-2xl p-4 sm:p-5 flex gap-4 cursor-pointer relative overflow-hidden border active:scale-[0.99] block" data-category="${category}" id="notif-card-${safeId}">
                    ${isUnread ? '<div class="unread-indicator absolute top-0 left-0 w-1.5 h-full bg-primary shadow-[0_0_8px_rgba(2,132,199,0.8)] transition-opacity duration-300"></div>' : ''}
                    <div class="w-12 h-12 rounded-2xl ${iconColor} flex items-center justify-center shrink-0 border shadow-sm">
                        <span class="material-symbols-outlined text-[26px]">${iconName}</span>
                    </div>
                    <div class="flex flex-col gap-1 flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <span class="font-bold text-on-surface text-base flex items-center gap-2 truncate">
                                ${item.title || 'การแจ้งเตือน'}
                                ${isUnread ? '<span class="unread-dot w-2 h-2 bg-primary rounded-full animate-pulse transition-opacity duration-300 shrink-0"></span>' : ''}
                            </span>
                            <span class="text-[11px] text-primary font-semibold bg-primary/10 px-2.5 py-0.5 rounded-full shrink-0">${formatTimeAgo(item.created_at)}</span>
                        </div>
                        <p class="text-sm text-on-surface-variant leading-relaxed mt-0.5 break-words">
                            ${item.message || ''}
                        </p>
                    </div>
                </a>
            `;
        }).join('');
    }

    async function markSingleAsRead(id, event, targetUrl) {
        if (event) {
            event.preventDefault();
        }
        try {
            const idx = userNotifications.findIndex(n => String(n.id) === String(id));
            if (idx !== -1) {
                userNotifications[idx].is_read = true;
                localStorage.setItem('cachedCustomerNotifications', JSON.stringify(userNotifications));
                updateUnreadBadgeUI(userNotifications);
            }

            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;
            if (fetcher && id && !String(id).startsWith('local_') && !String(id).startsWith('synth_')) {
                await fetcher(`notifications?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { Prefer: 'return=minimal' },
                    body: { is_read: true }
                }).catch(() => null);
            }
        } catch (_) {}

        if (targetUrl) {
            window.location.href = targetUrl;
        }
    }

    // Synthesize notifications from existing bookings in case DB is newly initialized
    function generateFallbackNotifications() {
        const generated = [];
        try {
            const active = JSON.parse(localStorage.getItem('activeCustomerBooking') || 'null');
            if (active && active.shopName) {
                generated.push({
                    id: 'synth_act_' + (active.id || active.bookingId || '1'),
                    title: 'การจองคิวสำเร็จ',
                    message: `คุณได้ทำการจองคิวที่ ${active.shopName} (${active.dateTime || active.bookingDate || 'วันนี้'}) เรียบร้อยแล้ว`,
                    type: 'BOOKING_UPDATE',
                    related_booking_id: active.id || active.bookingId,
                    is_read: false,
                    created_at: active.createdAt || new Date().toISOString()
                });
            }

            const list = JSON.parse(localStorage.getItem('appBookingsList') || '[]');
            if (Array.isArray(list)) {
                list.slice(0, 5).forEach(b => {
                    if (b && b.shopName && (!active || b.bookingId !== active.bookingId)) {
                        const isDone = ['completed', 'COMPLETED'].includes(b.status);
                        const isCancel = ['cancelled', 'CANCELLED', 'declined', 'refunded'].includes(b.status);
                        const title = isDone ? 'บริการล้างรถเสร็จสิ้นแล้ว' : (isCancel ? 'การจองคิวถูกยกเลิก' : 'การจองคิวสำเร็จ');
                        const msg = isDone ? `การบริการที่ ${b.shopName} เสร็จเรียบร้อยแล้ว เชิญตรวจรับรถและร่วมรีวิว` : `คุณได้ทำการจองคิวที่ ${b.shopName} (${b.dateTime || b.bookingDate})`;
                        generated.push({
                            id: 'synth_bk_' + (b.id || b.bookingId || Math.random()),
                            title: title,
                            message: msg,
                            type: 'BOOKING_UPDATE',
                            related_booking_id: b.id || b.bookingId,
                            is_read: true,
                            created_at: b.createdAt || b.bookingDate || new Date().toISOString()
                        });
                    }
                });
            }
        } catch (_) {}
        return generated;
    }

    async function loadLiveNotifications() {
        try {
            const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
            let user = null;
            if (client?.auth) {
                const sessRes = await client.auth.getSession().catch(() => null);
                user = sessRes?.data?.session?.user;
            }
            const uid = user?.id || localStorage.getItem('lastLoggedInUserId') || 'da839dcc-9bca-47d0-b178-29351930fff6';
            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;

            let dbNotifs = null;
            if (fetcher && uid) {
                const res = await fetcher(`notifications?user_id=eq.${uid}&order=created_at.desc`).catch(() => null);
                if (Array.isArray(res)) {
                    dbNotifs = res;
                }
            }

            if (Array.isArray(dbNotifs) && dbNotifs.length > 0) {
                userNotifications = dbNotifs;
                localStorage.setItem('cachedCustomerNotifications', JSON.stringify(userNotifications));
                renderNotificationsList(userNotifications);
                return;
            }

            // If DB returned empty, check local cached notifications
            const localCached = JSON.parse(localStorage.getItem('cachedCustomerNotifications') || '[]');
            if (Array.isArray(localCached) && localCached.length > 0) {
                userNotifications = localCached;
                renderNotificationsList(userNotifications);
                return;
            }

            // Fallback: generate from current customer bookings so user never sees a blank screen if they have bookings
            const fallbacks = generateFallbackNotifications();
            if (fallbacks.length > 0) {
                userNotifications = fallbacks;
                localStorage.setItem('cachedCustomerNotifications', JSON.stringify(userNotifications));
                renderNotificationsList(userNotifications);
            } else {
                showEmptyState(true);
            }
        } catch (e) {
            console.warn('Notifications exception:', e);
            const localCached = JSON.parse(localStorage.getItem('cachedCustomerNotifications') || '[]');
            if (localCached.length > 0) {
                userNotifications = localCached;
                renderNotificationsList(userNotifications);
            } else {
                showEmptyState(true);
            }
        }
    }

    // Tab switching logic
    function filterNotifs(category) {
        const tabs = ['all', 'booking', 'system'];
        tabs.forEach(tab => {
            const btn = document.getElementById(`btn-${tab}`);
            if (btn) {
                if (tab === category) {
                    btn.className = 'flex-shrink-0 px-4 py-1.5 bg-primary-container text-on-primary-container rounded-full text-xs font-bold border border-primary/50 shadow-sm transition-colors';
                } else {
                    btn.className = 'flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-primary rounded-full text-xs font-medium border border-outline-variant hover:border-primary transition-colors';
                }
            }
        });

        const items = document.querySelectorAll('.notif-item');
        let visibleCount = 0;
        
        items.forEach(item => {
            if (category === 'all' || item.dataset.category === category) {
                item.style.display = 'flex';
                visibleCount++;
            } else {
                item.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            showEmptyState(true);
        } else {
            showEmptyState(false);
        }
    }

    // Mark all as read logic
    async function markAllAsRead() {
        const indicators = document.querySelectorAll('.unread-indicator');
        const dots = document.querySelectorAll('.unread-dot');
        const unreadItems = document.querySelectorAll('.notif-item');

        indicators.forEach(el => el.classList.add('opacity-0'));
        dots.forEach(el => el.classList.add('opacity-0'));

        unreadItems.forEach(item => {
            item.classList.remove('ring-1', 'ring-primary/20', 'border-primary/30', 'shadow-[0_4px_20px_rgba(15,23,42,0.06)]');
            item.classList.add('bg-surface-container/70', 'opacity-90', 'border-outline-variant/30');
        });

        setTimeout(() => {
            indicators.forEach(el => el.remove());
            dots.forEach(el => el.remove());
        }, 300);

        // Update in-memory state & localStorage
        userNotifications.forEach(n => { n.is_read = true; });
        localStorage.setItem('cachedCustomerNotifications', JSON.stringify(userNotifications));
        updateUnreadBadgeUI(userNotifications);

        // Sync to Supabase
        try {
            const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
            let user = null;
            if (client?.auth) {
                const sessRes = await client.auth.getSession().catch(() => null);
                user = sessRes?.data?.session?.user;
            }
            const uid = user?.id || localStorage.getItem('lastLoggedInUserId') || 'da839dcc-9bca-47d0-b178-29351930fff6';
            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;
            if (uid && fetcher) {
                await fetcher(`notifications?user_id=eq.${uid}`, {
                    method: 'PATCH',
                    headers: { Prefer: 'return=minimal' },
                    body: { is_read: true }
                });
            }
        } catch(e) {}
    }

    // Avatar and Profile Synchronization
    document.addEventListener('DOMContentLoaded', () => {
        // ==========================================
        // LAYER 1: INSTANT 0.00ms RENDER FROM CACHE
        // ==========================================
        const saved = localStorage.getItem('customerProfile');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.avatar && !data.avatar.includes('googleusercontent')) {
                    const avatar = document.getElementById('desktop-header-avatar');
                    if (avatar) avatar.src = data.avatar;
                }
                const displayName = data.fullName || data.name;
                if (displayName) {
                    const nameEl = document.getElementById('desktop-header-name');
                    if (nameEl) nameEl.innerText = displayName;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Restore cached notifications at 0ms
        try {
            const cached = localStorage.getItem('cachedCustomerNotifications');
            if (cached) {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    userNotifications = parsed;
                    renderNotificationsList(userNotifications);
                }
            }
        } catch(e) {}

        // ========================================================
        // LAYER 2: SILENT FAST-TRACK BACKGROUND SYNC WITH SUPABASE
        // ========================================================
        (async () => {
            try {
                const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
                let user = null;
                if (client?.auth) {
                    const sessRes = await client.auth.getSession().catch(() => null);
                    user = sessRes?.data?.session?.user;
                }
                const uid = user?.id || localStorage.getItem('lastLoggedInUserId');
                const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;
                if (uid && fetcher) {
                    const profs = await fetcher(`profiles?id=eq.${uid}&select=avatar_url,full_name&limit=1`);
                    const prof = Array.isArray(profs) && profs.length > 0 ? profs[0] : null;
                    if (prof?.avatar_url) {
                        const avatar = document.getElementById('desktop-header-avatar');
                        if (avatar) avatar.src = prof.avatar_url;
                    }
                }
            } catch(e) {}

            loadLiveNotifications();
        })();
    });
