                    </div>

                    </div>
                    <div class="relative inline-block w-11 h-6 align-middle select-none transition duration-200 ease-in flex-shrink-0">
                        <input type="checkbox" id="notifyUpcomingQueue" checked class="peer absolute opacity-0 w-0 h-0"/>
                        <span class="absolute inset-0 bg-surface-variant rounded-full border border-outline-variant/50 transition-colors duration-200 ease-in-out peer-checked:bg-secondary peer-checked:border-secondary"></span>
                        <span class="absolute left-1 top-1 bg-outline-variant w-4 h-4 rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5 peer-checked:bg-on-secondary-container"></span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Group 2: Customer Reviews & Ratings -->
        <div class="bg-surface-container-low border border-outline-variant/30 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-secondary/30 transition-colors">
            <h2 class="text-sm font-bold text-primary flex items-center gap-2 mb-4 border-b border-outline-variant/30 pb-2">
                <span class="material-symbols-outlined text-[18px]">star</span> รีวิวและคะแนนความพึงพอใจ

                <label class="flex items-center justify-between cursor-pointer group/toggle">

                        <span class="absolute left-1 top-1 bg-outline-variant w-4 h-4 rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5 peer-checked:bg-on-secondary-container"></span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Group 3: Notification Channels -->
        <div class="bg-surface-container-low border border-outline-variant/30 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-secondary/30 transition-colors">
            <h2 class="text-sm font-bold text-primary flex items-center gap-2 mb-4 border-b border-outline-variant/30 pb-2">
                <span class="material-symbols-outlined text-[18px]">cell_tower</span> ช่องทางการรับแจ้งเตือน
            </h2>
            
            <div class="space-y-4">
                <!-- LINE Notification -->

                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">

                            <span class="text-[10px] font-bold text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30">แนะนำ</span>
                        </div>

                    </div>

                        <span class="absolute left-1 top-1 bg-outline-variant w-4 h-4 rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5 peer-checked:bg-on-secondary-container"></span>

                <!-- Push Notification -->

                        <span class="absolute inset-0 bg-surface-variant rounded-full border border-outline-variant/50 transition-colors duration-200 ease-in-out peer-checked:bg-secondary peer-checked:border-secondary"></span>

</main>

<!-- Action Area (Fixed Bottom for Mobile) -->
<div class="md:hidden fixed bottom-0 w-full z-40 bg-background/80 backdrop-blur-xl border-t border-outline-variant/30 py-3 px-4 flex justify-center shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
    <button type="submit" form="notificationsForm" class="w-full max-w-md h-12 bg-secondary text-on-secondary-container font-bold rounded-xl hover:bg-secondary/90 transition-colors active:scale-[0.98] shadow-lg shadow-secondary/20 flex items-center justify-center gap-2 text-base">
        <span class="material-symbols-outlined text-[22px]">save</span> บันทึกการตั้งค่า
    </button>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-24 md:bottom-8 left-1/2 transform -translate-x-1/2 bg-secondary-container text-on-secondary-container px-6 py-3 rounded-full shadow-lg border border-secondary/30 flex items-center gap-2 z-50 opacity-0 translate-y-10 pointer-events-none transition-all duration-300">
    <span class="material-symbols-outlined">check_circle</span>
    <span class="font-medium text-sm">บันทึกการตั้งค่าเรียบร้อยแล้ว!</span>
</div>

<script>
    let currentUserId = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const form = document.getElementById('notificationsForm');
        const toast = document.getElementById('toast');

        // Target all save buttons for loading state
        const saveBtns = [
            document.getElementById('saveTopBtn'),
            document.getElementById('saveBottomBtn'),
            document.querySelector('button[form="notificationsForm"]')
        ].filter(Boolean);

        // Helper: Apply settings object to form checkboxes
        const applySettingsToUI = (settings) => {
            if (!settings) return;
            ['notifyNewBooking', 'notifyCancelBooking', 'notifyUpcomingQueue', 'notifyNewReview', 'notifyLine', 'notifyPush'].forEach(id => {
                const el = document.getElementById(id);
                if (el && typeof settings[id] === 'boolean') {
                    el.checked = settings[id];
                }
            });
        };

        // 1. Immediately resolve current user ID from local storage cache
        try {
            const cachedUid = localStorage.getItem('lastLoggedInUserId') || localStorage.getItem('currentUserId');
            if (cachedUid) currentUserId = cachedUid;

            const cachedUserStr = localStorage.getItem('currentUser');
            if (cachedUserStr) {
                currentUser = JSON.parse(cachedUserStr);
                if (currentUser?.id) currentUserId = currentUser.id;
            }
        } catch (_) {}

        // 2. Immediately restore saved preferences from localStorage (zero flicker)
        try {
            let localSettings = null;
            if (currentUserId) {
                const scoped = localStorage.getItem('ownerNotificationSettings_' + currentUserId);
                if (scoped) localSettings = JSON.parse(scoped);
            }
            if (!localSettings) {
                const gen = localStorage.getItem('ownerNotificationSettings');
                if (gen) localSettings = JSON.parse(gen);
            }
            if (!localSettings) {
                const guest = localStorage.getItem('ownerNotificationSettings_guest');
                if (guest) localSettings = JSON.parse(guest);
            }
            if (localSettings) {
                applySettingsToUI(localSettings);
            }
        } catch (e) {
            console.warn('Local settings load notice:', e);
        }

        // 3. Robust Supabase session resolution
        const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
        if (client?.auth) {
            try {
                const { data: sessData } = await client.auth.getSession();
                let user = sessData?.session?.user;
                if (!user) {
                    const { data: userData } = await client.auth.getUser();
                    user = userData?.user;
                }

                if (user) {
                    currentUser = user;
                    currentUserId = user.id;
                    localStorage.setItem('lastLoggedInUserId', user.id);

                    if (user.user_metadata?.notification_settings) {
                        applySettingsToUI(user.user_metadata.notification_settings);
                        localStorage.setItem('ownerNotificationSettings_' + user.id, JSON.stringify(user.user_metadata.notification_settings));
                        localStorage.setItem('ownerNotificationSettings', JSON.stringify(user.user_metadata.notification_settings));
                    }
                }
            } catch (err) {
                console.warn('Supabase auth resolution notice:', err);
            }
        }

        // 4. Form Submit with Instant Optimistic UI (0ms Save)
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const settings = {
                notifyNewBooking: document.getElementById('notifyNewBooking')?.checked ?? true,
                notifyCancelBooking: document.getElementById('notifyCancelBooking')?.checked ?? true,
                notifyUpcomingQueue: document.getElementById('notifyUpcomingQueue')?.checked ?? true,
                notifyNewReview: document.getElementById('notifyNewReview')?.checked ?? true,
                notifyLine: document.getElementById('notifyLine')?.checked ?? true,
                notifyPush: document.getElementById('notifyPush')?.checked ?? true,
                updatedAt: new Date().toISOString()
            };

            const jsonStr = JSON.stringify(settings);

            // Layer 1: Immediately persist to localStorage (0ms)
            try {
                if (currentUserId) {
                    localStorage.setItem('ownerNotificationSettings_' + currentUserId, jsonStr);
                }
                localStorage.setItem('ownerNotificationSettings', jsonStr);
                localStorage.setItem('ownerNotificationSettings_guest', jsonStr);
                window.dispatchEvent(new Event('storage'));
            } catch (err) {
                console.warn('LocalStorage save error:', err);
            }

            // Provide Instant Visual Feedback (0ms)
            saveBtns.forEach(btn => {
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> บันทึกแล้ว!';
                btn.classList.add('bg-secondary-fixed');
            });

            // Show Toast feedback immediately
            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            // Layer 2: Fire Supabase background sync (Non-blocking)
            if (client?.auth && currentUserId) {
                client.auth.updateUser({
                    data: {
                        notification_settings: settings
                    }
                }).catch(err => {
                    console.warn('Supabase notification setting sync notice:', err);
                });
            }

            // Smooth redirect without stalling user
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
                window.location.href = 'Owner%20Profile.html';
            }, 600);
        });
    });
</script>
