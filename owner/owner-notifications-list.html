<!DOCTYPE html>
<html class="light" lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BestCarWash - การแจ้งเตือน</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="../supabase-client.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                  "background": "#f8fafc",           // Slate 50 (Clean Pearl White)
                  "on-background": "#0f172a",        // Slate 900 (Rich Charcoal)
                  "primary": "#0284c7",              // Ocean Blue / Sky 600
                  "secondary": "#059669",            // Emerald 600
                  "surface": "#ffffff",              // Pure White
                  "on-surface": "#0f172a",           // Slate 900
                  "surface-container": "#ffffff",    // Card Pure White
                  "surface-container-low": "#f8fafc",// Slate 50
                  "surface-container-highest": "#f1f5f9", // Slate 100
                  "surface-bright": "#ffffff",
                  "surface-variant": "#f1f5f9",
                  "on-surface-variant": "#475569",   // Slate 600 (Clear, legible)
                  "outline": "#94a3b8",              // Slate 400
                  "outline-variant": "#e2e8f0",      // Slate 200 border
                  "primary-container": "#0284c7",    // Ocean Blue
                  "on-primary-container": "#ffffff", // Pure White
                  "secondary-container": "#ecfdf5",  // Mint 50
                  "on-secondary-container": "#065f46", // Mint 900
                  "error": "#e11d48",                // Rose 600
                  "error-container": "#ffe4e6",
                  "secondary-fixed": "#10b981",
              },
              "spacing": {
                      "margin-mobile": "1rem",
                      "gutter": "1rem",
                      "touch-target-min": "3rem",
                      "stack-sm": "0.5rem",
                      "stack-md": "1rem",
                      "stack-lg": "1.5rem"
              },
              "fontFamily": {
                      "sans": ["Prompt", "Inter", "sans-serif"]
              }
            }
          }
        }
      </script>
</head>
<body class="bg-background text-on-background min-h-screen font-sans">
    
<!-- Top Bar -->
<header class="fixed top-0 w-full z-50 bg-background/95 backdrop-blur-md border-b border-outline-variant/30 shadow-sm px-4 md:px-8 lg:px-10 h-20 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <a href="Owner%20Dashboard.html" class="w-11 h-11 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-variant text-on-surface-variant hover:text-secondary border border-outline-variant/40 transition-all active:scale-95 group" title="กลับไปหน้าหลัก">
            <span class="material-symbols-outlined text-[22px] group-hover:-translate-x-0.5 transition-transform duration-200">arrow_back</span>
        </a>
        <div>
            <h1 class="text-base sm:text-lg md:text-xl font-bold text-on-surface tracking-tight leading-tight break-words">การแจ้งเตือนร้านค้า</h1>
            <span id="unread-count-text" class="text-xs text-secondary font-medium block"></span>
        </div>
    </div>
    <div class="flex justify-end">
        <button onclick="markAllAsRead()" class="text-secondary text-xs sm:text-sm md:text-base font-semibold hover:text-secondary-fixed transition-colors active:scale-95 px-3 sm:px-3.5 py-1.5 rounded-xl bg-secondary/10 border border-secondary/20 shrink-0">อ่านทั้งหมด</button>
    </div>
</header>

<main class="pt-24 md:pt-28 px-4 md:px-8 max-w-3xl mx-auto flex flex-col gap-4 pb-28 md:pb-12 w-full">
    
    <!-- Category Filter Pills -->
    <div class="flex gap-2 overflow-x-auto hide-scrollbar py-2 sticky top-20 bg-background/95 backdrop-blur-sm z-40 border-b border-outline-variant/10">
        <button onclick="filterOwnerNotifs('all')" id="btn-all" class="flex-shrink-0 px-4 py-1.5 bg-secondary text-white rounded-full text-xs font-bold shadow-sm transition-colors">ทั้งหมด</button>
        <button onclick="filterOwnerNotifs('booking')" id="btn-booking" class="flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-secondary rounded-full text-xs font-medium border border-outline-variant hover:border-secondary transition-colors">คิวจองใหม่</button>
        <button onclick="filterOwnerNotifs('review')" id="btn-review" class="flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-secondary rounded-full text-xs font-medium border border-outline-variant hover:border-secondary transition-colors">รีวิวและระบบ</button>
    </div>

    <div id="notifications-container" class="flex flex-col gap-3.5 mt-1">
        <!-- Dynamically loaded from Supabase notifications table -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center opacity-0 transition-opacity duration-300">
        <div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center mb-4 border border-outline-variant/30 shadow-inner">
            <span class="material-symbols-outlined text-[40px] text-outline-variant">notifications_off</span>
        </div>
        <h3 class="text-base md:text-lg font-bold text-on-surface mb-1">ไม่มีการแจ้งเตือน</h3>
        <p class="text-xs md:text-sm text-on-surface-variant">คุณยังไม่มีรายการแจ้งเตือนในขณะนี้</p>
    </div>

</main>

<script>
    let ownerNotifications = [];
    let currentOwnerUserId = null;

    function getOwnerNotifCacheKey(uid) {
        return uid ? `cachedOwnerNotifications_${uid}` : 'cachedOwnerNotifications';
    }

    function formatTimeAgo(dateString) {
        if (!dateString) return 'เมื่อสักครู่';
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return 'เมื่อสักครู่';
        const diffMs = Date.now() - d.getTime();
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return 'เพิ่งส่งมา';
        if (diffMins < 60) return `${diffMins} นาทีที่แล้ว`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} ชม. ที่แล้ว`;
        const diffDays = Math.floor(diffHours / 24);
        if (diffDays < 7) return `${diffDays} วันที่แล้ว`;
        return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
    }

    function updateUnreadBadgeUI(list) {
        const unreadCount = (list || []).filter(item => !item.is_read).length;
        const mobileBadge = document.getElementById('unread-count-text');
        if (mobileBadge) {
            mobileBadge.innerText = unreadCount > 0 ? `(${unreadCount} รายการใหม่)` : '';
        }
    }

    function showEmptyState(show) {
        const emptyState = document.getElementById('empty-state');
        const container = document.getElementById('notifications-container');
        if (show) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
            setTimeout(() => emptyState.classList.remove('opacity-0'), 10);
        } else {
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            emptyState.classList.add('opacity-0');
        }
    }

    function renderOwnerNotifications(list) {
        const container = document.getElementById('notifications-container');
        if (!list || list.length === 0) {
            showEmptyState(true);
            updateUnreadBadgeUI([]);
            return;
        }

        showEmptyState(false);
        updateUnreadBadgeUI(list);

        container.innerHTML = list.map(item => {
            const isUnread = !item.is_read;
            const itemType = (item.type || '').toLowerCase();
            const isReview = itemType.includes('review') || (item.title && item.title.includes('รีวิว'));
            const isRefund = itemType.includes('refund') || (item.title && item.title.includes('คืนเงิน')) || (item.title && item.title.includes('ยกเลิก'));
            
            const category = isReview ? 'review' : (isRefund ? 'booking' : 'booking');
            
            let icon = 'event_available';
            let iconColor = 'text-secondary bg-secondary/10 border-secondary/25';
            let targetUrl = 'owner-bookings.html';

            if (isReview) {
                icon = 'star';
                iconColor = 'text-amber-500 bg-amber-50 border-amber-200';
                targetUrl = 'owner-reviews.html';
            } else if (isRefund) {
                icon = 'assignment_return';
                iconColor = 'text-rose-500 bg-rose-50 border-rose-200';
                targetUrl = 'owner-bookings.html';
            }

            const safeId = String(item.id || '');

            return `
                <a href="${targetUrl}" onclick="markSingleAsRead('${safeId}', event, '${targetUrl}')" class="notif-item ${isUnread ? 'bg-white shadow-[0_4px_20px_rgba(15,23,42,0.06)] border-secondary/30 ring-1 ring-secondary/20' : 'bg-surface-container/70 opacity-90 border-outline-variant/30'} hover:bg-surface-container-highest transition-all rounded-2xl p-4 sm:p-5 flex gap-4 cursor-pointer relative overflow-hidden border active:scale-[0.99] block" data-category="${category}">
                    ${isUnread ? '<div class="unread-indicator absolute top-0 left-0 w-1.5 h-full bg-secondary shadow-[0_0_8px_rgba(5,150,105,0.8)] transition-opacity duration-300"></div>' : ''}
                    <div class="w-12 h-12 rounded-2xl ${iconColor} flex items-center justify-center shrink-0 border shadow-sm">
                        <span class="material-symbols-outlined text-[26px]">${icon}</span>
                    </div>
                    <div class="flex flex-col gap-1 flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <span class="font-bold text-on-surface text-base flex items-center gap-2 truncate">
                                ${item.title || 'การแจ้งเตือน'}
                                ${isUnread ? '<span class="unread-dot w-2 h-2 bg-secondary rounded-full animate-pulse transition-opacity duration-300 shrink-0"></span>' : ''}
                            </span>
                            <span class="text-[11px] text-secondary font-semibold bg-secondary/10 px-2.5 py-0.5 rounded-full shrink-0">${formatTimeAgo(item.created_at)}</span>
                        </div>
                        <p class="text-sm text-on-surface-variant leading-relaxed mt-0.5 break-words">
                            ${item.message || ''}
                        </p>
                    </div>
                </a>
            `;
        }).join('');
    }

    async function markSingleAsRead(id, event, targetUrl) {
        if (event) event.preventDefault();
        try {
            const idx = ownerNotifications.findIndex(n => String(n.id) === String(id));
            if (idx !== -1) {
                ownerNotifications[idx].is_read = true;
                const cacheKey = getOwnerNotifCacheKey(currentOwnerUserId);
                localStorage.setItem(cacheKey, JSON.stringify(ownerNotifications));
                updateUnreadBadgeUI(ownerNotifications);
            }

            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;
            if (fetcher && id && !String(id).startsWith('local_') && !String(id).startsWith('synth_')) {
                await fetcher(`notifications?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { Prefer: 'return=minimal' },
                    body: { is_read: true }
                }).catch(() => null);
            }
        } catch (_) {}

        if (targetUrl) {
            window.location.href = targetUrl;
        }
    }

    async function loadOwnerNotifications() {
        try {
            const client = window.supabaseClient || (typeof getSupabaseClient === 'function' ? getSupabaseClient() : null);
            let userId = null;
            if (client?.auth) {
                try {
                    const { data: s } = await client.auth.getSession();
                    userId = s?.session?.user?.id;
                } catch(_) {}
            }
            userId = userId || localStorage.getItem('lastLoggedInUserId');
            if (!userId) {
                ownerNotifications = [];
                showEmptyState(true);
                updateUnreadBadgeUI([]);
                return;
            }
            currentOwnerUserId = userId;
            const cacheKey = getOwnerNotifCacheKey(userId);
            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;

            let dbNotifs = null;
            if (fetcher) {
                const res = await fetcher(`notifications?user_id=eq.${userId}&order=created_at.desc`).catch(() => null);
                if (Array.isArray(res)) {
                    dbNotifs = res;
                }
            }

            if (Array.isArray(dbNotifs)) {
                ownerNotifications = dbNotifs;
                localStorage.setItem(cacheKey, JSON.stringify(ownerNotifications));
                renderOwnerNotifications(ownerNotifications);
                return;
            }

            // Local cached check for this owner only
            const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
            if (Array.isArray(cached)) {
                ownerNotifications = cached;
                renderOwnerNotifications(ownerNotifications);
                return;
            }

            ownerNotifications = [];
            showEmptyState(true);
            updateUnreadBadgeUI([]);
        } catch(e) {
            console.warn('Owner notifications exception:', e);
            ownerNotifications = [];
            showEmptyState(true);
            updateUnreadBadgeUI([]);
        }
    }

    function filterOwnerNotifs(category) {
        const tabs = ['all', 'booking', 'review'];
        tabs.forEach(tab => {
            const btn = document.getElementById(`btn-${tab}`);
            if (btn) {
                if (tab === category) {
                    btn.className = 'flex-shrink-0 px-4 py-1.5 bg-secondary text-white rounded-full text-xs font-bold shadow-sm transition-colors';
                } else {
                    btn.className = 'flex-shrink-0 px-4 py-1.5 bg-surface-container-highest text-on-surface hover:text-secondary rounded-full text-xs font-medium border border-outline-variant hover:border-secondary transition-colors';
                }
            }
        });

        const items = document.querySelectorAll('.notif-item');
        let visibleCount = 0;

        items.forEach(item => {
            if (category === 'all' || item.dataset.category === category) {
                item.style.display = 'flex';
                visibleCount++;
            } else {
                item.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            showEmptyState(true);
        } else {
            showEmptyState(false);
        }
    }

    async function markAllAsRead() {
        const indicators = document.querySelectorAll('.unread-indicator');
        const dots = document.querySelectorAll('.unread-dot');
        const unreadItems = document.querySelectorAll('.notif-item');

        indicators.forEach(el => el.classList.add('opacity-0'));
        dots.forEach(el => el.classList.add('opacity-0'));

        unreadItems.forEach(item => {
            item.classList.remove('ring-1', 'ring-secondary/20', 'border-secondary/30', 'shadow-[0_4px_20px_rgba(15,23,42,0.06)]');
            item.classList.add('bg-surface-container/70', 'opacity-90', 'border-outline-variant/30');
        });

        setTimeout(() => {
            indicators.forEach(el => el.remove());
            dots.forEach(el => el.remove());
        }, 300);

        ownerNotifications.forEach(n => { n.is_read = true; });
        const cacheKey = getOwnerNotifCacheKey(currentOwnerUserId);
        localStorage.setItem(cacheKey, JSON.stringify(ownerNotifications));
        updateUnreadBadgeUI(ownerNotifications);

        try {
            const userId = currentOwnerUserId || localStorage.getItem('lastLoggedInUserId');
            const fetcher = window.safeSupabaseRest || window.fetchSupabaseRest;
            if (userId && fetcher) {
                await fetcher(`notifications?user_id=eq.${userId}`, {
                    method: 'PATCH',
                    headers: { Prefer: 'return=minimal' },
                    body: { is_read: true }
                });
            }
        } catch(e) {
            console.warn('Owner mark read error:', e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // ==========================================
        // LAYER 1: INSTANT 0.00ms RENDER FROM CACHE (ONLY IF MATCHING USER)
        // ==========================================
        try {
            const uid = localStorage.getItem('lastLoggedInUserId');
            if (uid) {
                currentOwnerUserId = uid;
                const cached = localStorage.getItem(getOwnerNotifCacheKey(uid));
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        ownerNotifications = parsed;
                        renderOwnerNotifications(ownerNotifications);
                    }
                }
            }
        } catch(_) {}

        // ========================================================
        // LAYER 2: SILENT FAST-TRACK BACKGROUND SYNC WITH SUPABASE
        // ========================================================
        loadOwnerNotifications();
    });
</script>

</body>
</html>
